# Worker in front of plokkaus.vempai.men: shows a "Starting up…" page while
# the sleeping Scaleway container wakes. See docs/loading-page-plan.md.
# Both routes (plokkaus.vempai.men/* → this Worker, /api/* → no Worker) live
# outside this file (Cloudflare API, docs/operations.md): a route listed here
# would be re-created on every deploy, which turns its "fail open" off.
name = "plokkaus-front"
main = "worker.js"
compatibility_date = "2026-09-24"
workers_dev = false
