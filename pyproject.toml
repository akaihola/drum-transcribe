[project]
name = "drum-transcribe"
version = "0.1.0"
description = "Audio -> drum sheet music pipeline: Demucs + ADTOF + beat_this + music21"
requires-python = ">=3.11,<3.13"
dependencies = [
    "adtof-pytorch",
    "audio-separator[cpu]>=0.30",
    "beat-this",
    "demucs>=4.1",
    "gdown>=5",
    "librosa>=0.10",
    "music21>=9.1",
    "numpy",
    "pretty-midi>=0.2.10",
    "soundfile",
    "torch>=2.6",
    "torchaudio",
    "yt-dlp>=2025.1.1",
]

[project.scripts]
drum-transcribe = "drum_transcribe.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/drum_transcribe"]

[tool.uv]
environments = ["sys_platform == 'linux'"]

[tool.uv.sources]
adtof-pytorch = { git = "https://github.com/xavriley/ADTOF-pytorch" }
torch = { index = "pytorch-cpu" }
torchaudio = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
